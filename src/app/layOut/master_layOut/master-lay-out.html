<div class="app-layout">

  <!-- ===== دکوراسیون پس‌زمینه ===== -->
  <div class="bg-decor">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="tooth-icon">🦷</div>
    <div class="tooth-icon">🦷</div>
    <div class="tooth-icon">🦷</div>
  </div>

<header class="app-header">

  <!-- بخش چپ: دکمه‌های ناوبری -->
  <nav class="header-nav">
    <a href="#" class="nav-btn profile-btn">
      <span class="icon">👤</span> پروفایل
    </a>
    <a href="#" class="nav-btn settings-btn">
      <span class="icon">⚙️</span> تنظیمات
    </a>
    <a href="#" class="nav-btn logout-btn">
      <span class="icon">🚪</span> خروج
    </a>
  </nav>

  <!-- بخش راست: لوگو -->
  <a routerLink="/" class="logo">
    <img src="logo.png" alt="لوگو" class="logo-img">
  </a>

</header>

  <!-- ===== بخش اصلی (سایدبار راست + محتوا) ===== -->
  <div class="main-area">

    <!-- محتوای اصلی (چپ) -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <!-- سایدبار (راست) -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a [routerLink]="['/addOrder']" routerLinkActive="active-link">ثبت سفارش جدید</a></li>
          <!-- آیتم‌های دیگر -->
        </ul>
      </nav>
    </aside>

  </div>

  <!-- ===== فوتر ===== -->
  <footer class="app-footer">
    <p>تمامی حقوق محفوظ است © ۱۴۰۵</p>
  </footer>
</div>
