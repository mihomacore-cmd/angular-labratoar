<div class="forget-container">
  <div class="forget-card">
    <h2>فراموشی رمز عبور</h2>
    <p class="subtitle">
      شماره همراه خود را وارد کنید تا لینک بازیابی رمز عبور برای شما ارسال شود
    </p>

    <form (ngSubmit)="onSubmit()" [formGroup]="forgetForm">
      <!-- شماره همراه -->
      <div class="form-group full-width">
        <label for="phone">شماره همراه</label>
        <input
          id="phone"
          type="text"
          formControlName="phone"
          placeholder="مثلاً ۰۹۱۲۳۴۵۶۷۸۹"
          required
        />
        <div *ngIf="getError('phone', 'required')" class="error-message">
          شماره همراه اجباری است
        </div>
        <div *ngIf="getError('phone', 'pattern')" class="error-message">
          شماره همراه باید ۱۱ رقم باشد (۰۹۱۲۳۴۵۶۷۸۹)
        </div>
      </div>

      <!-- دکمه ارسال -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="forgetForm.invalid || isLoading()"
      >
        <ng-container *ngIf="!isLoading(); else loadingTpl">
          <span>ارسال لینک بازیابی</span>
        </ng-container>

        <ng-template #loadingTpl>
          <span class="spinner"></span>
          <span class="loading-text">در حال ارسال...</span>
        </ng-template>
      </button>

      <div *ngIf="errorMessage()" class="error-message server-error">
        {{ errorMessage() }}
      </div>
    </form>

    <div class="form-footer">
      <a routerLink="/login" class="link">بازگشت به صفحه ورود</a>
    </div>
  </div>
</div>
