<div class="login-container">
  <div class="login-card">
    <h2>ورود به حساب</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <!-- Username Input -->
      <div class="form-group">
        <label for="username">نام کاربری</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="لطفاً نام کاربری خود را وارد کنید"
          required
        />
        <div *ngIf="getError('username', 'required')" class="error-message">
          نام کاربری اجباری است
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password">گذرواژه</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="لطفاً رمز عبور خود را وارد کنید"
          required
        />
        <div *ngIf="getError('password', 'required')" class="error-message">
          گذرواژه اجباری است
        </div>
        <div *ngIf="getError('password', 'minlength')" class="error-message">
          رمز عبور باید حداقل ۶ کاراکتر باشد
        </div>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid || isLoading()"
      >
        <ng-container *ngIf="!isLoading(); else loadingTpl">
          <span>ورود</span>
        </ng-container>

        <ng-template #loadingTpl>
          <span class="spinner"></span>
          <span class="loading-text">در حال ورود...</span>
        </ng-template>
      </button>

      <div *ngIf="loginError()" class="error-message server-error">
        {{ loginError() }}
      </div>
    </form>

    <div class="form-footer">
      <a href="#" class="link">فراموشی رمز عبور؟</a>
      <span class="divider">|</span>
      <a href="#" class="link">ثبت نام</a>
    </div>
  </div>
</div>
